services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    platform: linux/amd64
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181
  
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    platform: linux/amd64
    depends_on:
      - zookeeper
    ports:
      - 29092:9092
      - 19092:19092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092, CONNECTIONS_FROM_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONNECTIONS_FROM_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  productdb:
    image: postgres
    platform: linux/amd64
    restart: always
    ports:
      - 54320:5432
    environment:
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product
      
  userdb:
    image: postgres
    platform: linux/amd64
    restart: always
    ports:
      - 54321:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
  
  coursedb:
    image: postgres
    platform: linux/amd64
    restart: always
    ports:
      - 54322:5432
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
  
  adminer:
    image: adminer
    platform: linux/amd64
    restart: always
    ports:
      - 18080:8080

  course:
    image: afloresca/course:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://coursedb:5432/course
      - USERSERVICE_GETUSERBYEMAIL_URL=http://user-service:18082/users/byEmail/{email}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    pull_policy: never
    container_name: course-service
    depends_on:
      - kafka
      - coursedb
    ports:
      - "18084:18084"
    networks:
      - default

  product-catalog:
    image: afloresca/productcatalog:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://productdb:5432/product
      - USERSERVICE_GETUSERBYEMAIL_URL=http://user-service:18082/users/byEmail/{email}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    pull_policy: never
    container_name: product-catalog-service
    depends_on:
      - kafka
      - productdb
    ports:
      - "18081:18081"
    networks:
      - default

  notification:
    image: afloresca/notification:latest
    environment:
      - USERSERVICE_GETUSERBYEMAIL_URL=http://user-service:18082/users/byEmail/{email}
      - PRODUCTSERVICE_GETPRODUCTDETAILS_URL=http://product-catalog-service:18081/products/{productId}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    pull_policy: never
    container_name: notification-service
    depends_on:
      - kafka
    ports:
      - "18083:18083"
    networks:
      - default
  user:
    image: afloresca/user:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://userdb:5432/user
      - PRODUCTSERVICE_GETPRODUCTDETAILS_URL=http://product-catalog-service:18081/products/{productId}
      - USERSERVICE_GETUSERBYEMAIL_URL=http://user-service:18082/users/byEmail/{email}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    pull_policy: never
    container_name: user-service
    depends_on:
      - kafka
      - userdb
    ports:
      - "18082:18082"
    networks:
      - default

    
